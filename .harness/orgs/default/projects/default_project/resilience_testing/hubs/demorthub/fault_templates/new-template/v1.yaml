apiVersion: chaos.harness.io/v1
hubIdentity: demorthub
identity: new-template
kind: FaultTemplate
name: new-template
orgIdentifier: default
projectIdentifier: default_project
spec:
  category:
  - Kubernetes
  infras:
  - KubernetesV2
  links:
  - name: Permissions
    url: ""
  permissionsRequired: Basic
  spec:
    chaos:
      faultName: byoc-injector
      kubernetes:
        containerSecurityContext:
          capabilities: {}
        hostIPC: false
        hostNetwork: false
        hostPID: false
        image: nginx:1.20.0
        resourceRequirements: {}
      params:
      - name: CHAOS_DURATION
        value: 30s
  type: Custom
versionLabel: v1
