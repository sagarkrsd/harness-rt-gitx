apiVersion: chaos.harness.io/v1
hubIdentity: latest940hub
identity: http-probe-268
kind: ProbeTemplate
name: new-http-probe-268
orgIdentifier: default
projectIdentifier: default_project
spec:
  infrastructureType: Kubernetes
  probeProperties:
    httpProbe:
      method:
        get:
          criteria: ==
          responseCode: "200"
      tlsConfig:
        caFile: ""
        certFile: ""
        keyFile: ""
      url: http://localhost:8080
  runProperties:
    attempt: 1
    initialDelay: 5s
    interval: 2s
    pollingInterval: 30s
    timeout: 10s
  type: httpProbe
versionLabel: v1.5.0
